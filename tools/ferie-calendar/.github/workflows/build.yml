name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      year:
        description: Year to build
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the tests
        run: python3 -m unittest discover -s tests

      - name: Build the sheet
        run: |
          year="${{ inputs.year }}"
          if [ -z "$year" ]; then
            year=$(ls data/*.toml | sed 's:.*/::; s:\.toml::' | sort -n | tail -1)
          fi
          python3 build.py "$year"

      - uses: actions/upload-artifact@v4
        with:
          name: holiday-planner
          path: out/
