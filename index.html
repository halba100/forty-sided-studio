<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<style>:root{--charcoal-dark:#14110d;--charcoal-panel:#221d17;--bronze:#8a6a45;--gold:#c9a24b;--gold-dim:#a8863e;--ink:#e8e1d3;--ink-dim:#b9b0a0;--line:#3a3226;}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--charcoal-dark);background-image:radial-gradient(ellipse at 50% -10%, rgba(201,162,75,0.08), transparent 55%),repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);color:var(--ink);font-family:'Spectral', Georgia, serif;line-height:1.65;-webkit-font-smoothing:antialiased;}
a.fss-link{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--gold-dim);transition:color .2s ease,border-color .2s ease;}
a.fss-link:hover,a.fss-link:focus-visible{color:var(--ink);border-color:var(--gold);}
a.fss-link:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
.hero{position:relative;min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 1.5rem 2.5rem;overflow:hidden;}
.emblem{width:220px;height:220px;margin-bottom:1.5rem;filter:drop-shadow(0 0 18px rgba(201,162,75,0.18));}
.eyebrow{margin:0 0 .5rem;font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-dim);}
.wordmark{font-family:'UnifrakturCook',serif;font-weight:700;font-size:clamp(2.4rem,7vw,4.4rem);color:var(--gold);margin:0;line-height:1.1;text-shadow:0 0 24px rgba(201,162,75,0.15);}
.tagline{margin:1rem 0 1.75rem;font-style:italic;color:var(--ink-dim);font-size:1.05rem;letter-spacing:.02em;}
.nav-links{display:flex;gap:1.75rem;flex-wrap:wrap;justify-content:center;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:1.5rem;}
.nav-links a{border-bottom:1px solid var(--line);color:var(--ink-dim);}
.nav-links a:hover{color:var(--ink);border-color:var(--gold);}
.lang-row{display:flex;gap:.4rem;}
.lang-btn{font-family:'Spectral',serif;font-size:.7rem;letter-spacing:.08em;padding:.3rem .6rem;border-radius:2px;cursor:pointer;background:transparent;color:var(--ink-dim);border:1px solid var(--line);}
.lang-btn:hover{color:var(--ink);border-color:var(--gold);}
.lang-btn.active{color:var(--gold);border-color:var(--gold);}
main{max-width:720px;margin:0 auto;padding:0 1.5rem;}
section{padding:3.5rem 0;border-top:1px solid var(--line);}
h2{font-family:'Spectral',serif;font-weight:600;font-size:.85rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold-dim);margin:0 0 1.5rem;}
.about p,.contact p{color:var(--ink-dim);max-width:60ch;}
.founder-row{display:flex;gap:1.75rem;align-items:flex-start;flex-wrap:wrap;}
.founder-photo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex-shrink:0;}
.founder-label{color:var(--gold-dim);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;margin:.3rem 0 .4rem;}
.founder-name{color:var(--gold);font-family:'UnifrakturCook',serif;font-size:1.3rem;margin:0 0 .6rem;}
.founder-text{color:var(--ink-dim);max-width:60ch;margin:0 0 .6rem;}
.galli-row{display:flex;align-items:center;gap:1rem;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--line);}
.galli-photo{width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex-shrink:0;}
.galli-name{color:var(--gold);font-family:'UnifrakturCook',serif;font-size:1.1rem;margin:0 0 .2rem;}
.galli-caption{color:var(--ink-dim);font-size:.8rem;margin:0;}
.world-subtitle{font-family:'UnifrakturCook',serif;font-weight:700;font-size:clamp(1.6rem,4vw,2.4rem);color:var(--gold);margin:0 0 .75rem;line-height:1.15;}
.world-tagline{color:var(--ink-dim);max-width:65ch;font-style:italic;margin:0 0 2rem;}
.world-row{display:flex;gap:2rem;flex-wrap:wrap-reverse;}
.world-text{flex:2;min-width:260px;}
.world-cover{flex:1;min-width:160px;max-width:220px;}
.world-cover img{width:100%;height:auto;border:1px solid var(--line);border-radius:2px;display:block;}
.world-cover p{color:var(--ink-dim);font-size:.75rem;margin:.6rem 0 0;text-align:center;}
.project-card{background:var(--charcoal-panel);border:1px solid var(--line);border-left:3px solid var(--gold-dim);border-radius:3px;padding:2rem;}
.project-title{font-family:'UnifrakturCook',serif;font-size:1.8rem;color:var(--gold);margin:0 0 .3rem;}
.project-sub{margin:0 0 1.2rem;color:var(--ink-dim);font-style:italic;}
.project-desc{color:var(--ink);}
.status-line{display:flex;align-items:center;gap:.5rem;margin:1.5rem 0 0;font-size:.85rem;color:var(--ink-dim);letter-spacing:.02em;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px rgba(201,162,75,0.8);flex-shrink:0;}
.roadmap{margin-top:1.75rem;padding-top:1.5rem;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.9rem;}
.roadmap-item{display:flex;flex-direction:column;gap:.3rem;}
.roadmap-head{display:flex;align-items:flex-start;gap:.65rem;font-size:.88rem;}
.roadmap-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:.35rem;}
.roadmap-dot.done{background:var(--gold);}
.roadmap-dot.pending{border:1px solid var(--line);}
.roadmap-label{flex:1;}
.roadmap-status{margin-left:auto;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;flex-shrink:0;}
.roadmap-detail{color:#8a7d6a;font-size:.8rem;margin:0 0 0 1.35rem;max-width:56ch;}
.publisher-line{margin-top:1.5rem;display:flex;align-items:center;gap:.9rem;font-size:.85rem;color:var(--ink-dim);flex-wrap:wrap;}
.publisher-line img{height:28px;width:auto;opacity:.9;}
.mail-link{display:inline-block;font-size:1.1rem;margin-top:.5rem;}
footer{text-align:center;padding:3rem 1.5rem 2.5rem;color:var(--ink-dim);font-size:.8rem;border-top:1px solid var(--line);}
footer p{margin:.3rem 0;}
@media (max-width:480px){.hero{min-height:82vh;padding:3rem 1.25rem 2.5rem;}section{padding:2.75rem 0;}.project-card{padding:1.5rem;}}
.legal{max-width:720px;margin:0 auto;padding:4rem 1.5rem 5rem;}
.legal h1{font-family:'UnifrakturCook',serif;color:var(--gold);font-size:clamp(2rem,6vw,2.8rem);margin-bottom:.3rem;}
.legal .updated{color:var(--ink-dim);font-size:.85rem;margin-bottom:2.5rem;}
.legal h2{margin-top:2.5rem;}
.legal p{color:var(--ink-dim);}</style>
<title>Forty Sided Studio</title>
<meta name="description" content="Forty Sided Studio — an independent studio forging dark fantasy tabletop-rooted games.">
</head>
<body>

<header class="hero">
  <img class="emblem" src="assets/logo-512.png" alt="Forty Sided Studio">
  <p class="eyebrow" data-t="eyebrow"></p>
  <h1 class="wordmark">Forty Sided Studio</h1>
  <p class="tagline" data-t="tagline"></p>
  <nav class="nav-links">
    <a href="#about" data-t="navStudio"></a>
    <a href="#world" data-t="navWorld"></a>
    <a href="#project" data-t="navProject"></a>
    <a href="#contact" data-t="navContact"></a>
  </nav>
  <div class="lang-row" id="lang-row"></div>
</header>

<main>
  <section id="about" class="about">
    <h2 data-t="aboutTitle"></h2>
    <div class="founder-row">
      <img class="founder-photo" src="assets/founder-photo.png" alt="Founder">
      <div style="flex:1; min-width:220px;">
        <p class="founder-label" data-t="founderTitle"></p>
        <p class="founder-name" data-t="founderName"></p>
        <p class="founder-text" data-t="founderP1"></p>
        <p class="founder-text"><span data-t="founderCredit"></span> <a class="fss-link" href="https://www.terradeigiochi.it/streben/10922-streben-oltre-l-impero-hamburg-9781281693204.html" target="_blank" rel="noopener" data-t="founderCreditWork"></a>.</p>
        <a class="fss-link" href="https://www.facebook.com/davide.albertosi/" target="_blank" rel="noopener" style="font-size:.85rem;">Facebook</a>
      </div>
    </div>
    <p data-t="aboutP1" style="margin-top:1.75rem;"></p>
    <p data-t="aboutP2"></p>
    <div class="galli-row">
      <img class="galli-photo" src="assets/giovanni-galli.png" alt="Giovanni Galli">
      <div>
        <p class="galli-name" data-t="galliName"></p>
        <p class="galli-caption" data-t="galliCaption"></p>
        <p class="galli-caption" style="margin-top:.4rem; max-width:50ch;" data-t="galliNote"></p>
        <a class="fss-link" href="https://www.dungeoneer-games.it/streben/" target="_blank" rel="noopener" style="font-size:.85rem;"><span data-t="galliLinkText"></span> →</a>
      </div>
    </div>
  </section>

  <section id="world">
    <h2 data-t="worldTitle"></h2>
    <h3 class="world-subtitle" data-t="worldSubtitle"></h3>
    <p class="world-tagline" data-t="worldTagline"></p>
    <div class="world-row">
      <div class="world-text">
        <p data-t="worldP1"></p>
        <p data-t="worldP2"></p>
        <p data-t="worldP3"></p>
        <p data-t="worldP4"></p>
      </div>
      <div class="world-cover">
        <img src="assets/streben-cover.png" alt="Streben — Il Gioco di Ruolo Old School Grim Fantasy">
        <p>Streben — di Giovanni Galli e Nicolò Rossi</p>
      </div>
    </div>
  </section>

  <section id="project" class="project">
    <h2 data-t="projectTitle"></h2>
    <div class="project-card">
      <h3 class="project-title" data-t="projectName"></h3>
      <p class="project-sub" data-t="projectSub"></p>
      <p class="project-desc" data-t="projectDesc"></p>
      <p class="status-line"><span class="status-dot"></span><span data-t="statusLine"></span></p>
      <div class="roadmap" id="roadmap"></div>
    </div>
    <div class="publisher-line">
      <span data-t="publisherLine"></span>
      <a href="https://www.dungeoneer-games.it/" target="_blank" rel="noopener" style="border-bottom:none;">
        <img src="https://www.dungeoneer-games.it/wp-content/uploads/2020/08/DGS-logo-white-01-3.png" alt="Dungeoneer Games & Simulations">
      </a>
    </div>
  </section>

  <section id="contact" class="contact">
    <h2 data-t="contactTitle"></h2>
    <p data-t="contactText"></p>
    <a class="fss-link mail-link" href="mailto:fortysidedstudio@gmail.com">fortysidedstudio@gmail.com</a>
  </section>
</main>

<footer>
  <p>&copy; <span id="year"></span> Forty Sided Studio. <span data-t="footerRights"></span></p>
  <p><a class="fss-link" href="privacy.html" data-t="footerPrivacy"></a></p>
</footer>

<script>
const T = {"en":{"langName":"EN","eyebrow":"Independent · Dark Fantasy · Tabletop-Rooted","tagline":"There is no d40. We rolled one anyway.","navStudio":"Studio","navWorld":"The World","navProject":"Current Project","navContact":"Contact","founderTitle":"About Me","founderName":"Davide — aka Halba100","founderP1":"Davide answers to two names: his own, and Halba100 — the alias under which he has rolled dice, cursed CRT screens, and hoarded ancient circuit boards since before he can properly remember. Legend (his own) holds that he built an 80s arcade cabinet purely to have somewhere to summon his ghosts. When the screens finally release him, he retreats to the mountains — call it trekking, call it penance.","founderCredit":"He has also written for the source material itself: the Streben expansion","founderCreditWork":"Oltre l'Impero: Hamburg","aboutTitle":"The Studio","aboutP1":"Forty Sided Studio is a one-person forge, but not a beginner's. Its founder has been at the tabletop for decades and, for years, ran something bigger: live-action campaigns, complete with original characters, plots, and whole worlds built from scratch for LARP events. Everything here starts from the same place — a genuine love for games as a medium, whatever shape they take.","aboutP2":"No publisher, no committee. Just a developer who has also spent 25 years working in IT, and brings that same rigor and organisation to building games — a stack of notebooks, a long-standing appetite for hex grids and grim skies, and enough process discipline to actually ship. Developed hand in hand with Giovanni Galli, creator of the Streben tabletop RPG and its solo spin-off Streben Der Jäger, who validates every step of the adaptation.","galliName":"Giovanni Galli","galliCaption":"Creator of Streben — winner, NDU Awards 2022, Best Setting (People's Choice)","galliNote":"The Streben core rulebook is also available in English, and the setting has grown over the years through numerous modules and adventures.","galliLinkText":"Explore Streben","worldTitle":"Streben","worldSubtitle":"The Dark Beyond the Apocalypse","worldTagline":"Streben is an Old School Grim Fantasy Post-Apocalyptic RPG where humanity fights to survive, relying on whatever is left to them. Resisting is the only salvation.","worldP1":"Anno Domini 1220: the Apocalypse arrived. A blazing globe crossed the skies of Europe and sank beneath the Mediterranean Sea. A roar shook the world — then the nightmare began. The first survivors spoke of devastation and the dead as far as the eye could see; the expeditions sent to investigate never returned, and soon the nightmare simply became how things were. Monsters appeared everywhere: abominations of every shape, ready to kill anything within reach.","worldP2":"Humanity tried to organize — so did they. The Kingdoms of Men fell one after another. Then came the mischling, hybrids caught halfway between beast and man: the strength of one, the cunning of the other, bound together in societies that made them more dangerous than many solitary monsters. After decades of chaos and ruin, hope rose from the ashes of the Holy Roman Empire: the new Empire of Heroes, born from nine fortified cities joined into a single bulwark against the end.","worldP3":"In the Empire of Heroes, anyone who proves worthy can become their city's champion; and should the Emperor fall, the next ruler is chosen from among the nine champions, tested until only the most virtuous remains. Holding it all together is an iron decree laid down by the Magisterium, the new faith that binds every Marked — those born able to bend magic — and outlaws every trace of the past: every known religion is forbidden, and nothing from before may survive.","worldP4":"And yet some still grow rich looting the old ruined strongholds in secret, selling their treasures to collectors through the black market: they're called Schatzjäger. Militia, Magisterium, the mercenary guild found in every city, or the scum willing to risk everything to enrich themselves and undermine the new imperial order — the choice is yours. Whichever road you take, in Streben you can carve your way through sacrifice and determination... or die trying.","projectTitle":"Current Project","projectName":"Streben Der Jäger","projectSub":"A hex-based tactical adaptation of the Streben Der Jäger solo game, set in the dark world of Streben.","projectDesc":"Streben Der Jäger began as a solitaire tabletop game of grid-based, procedural missions set in the dark world of Streben. This digital version keeps that tactical, highly replayable core: move phase by phase across broken hex ground, choose when to strike and when to hold the line, and drag what's left of a fortified city through six missions of steel and abominations — all the way to final redemption, if you survive long enough.","statusLine":"In development — mobile, Android","roadmap":[{"label":"Hex tactical combat engine","status":"Nearly complete","done":true,"detail":"Movement, line of sight, initiative, monsters with their own AI and pathfinding, a talent and spell system, potions, luck points: the core ruleset is implemented and playable end-to-end."},{"label":"Campaign narrative & world-building","status":"In progress","done":true,"detail":"Six playable missions, cutscenes for key moments, a redemption arc after 12 missions cleared, a Graveyard and Hall of Champions for fallen (and surviving) characters. Lore and new narrative content keep expanding."},{"label":"Mobile UI & controls","status":"Nearly complete","done":true,"detail":"A working native Android build, touch controls designed from scratch (no system dialogs), an interactive tutorial for new players, an achievements system, and localisation into 5 languages."},{"label":"Closed playtesting","status":"In preparation","done":false,"detail":"Next step: a small first group of testers on the Android build to gather feedback before a wider release."},{"label":"Multilingual localisation (IT/EN/FR/ES/DE)","status":"Complete","done":true,"detail":"Site and game interface translated, with automatic language detection."}],"contactTitle":"Get in Touch","contactText":"Questions, press, feedback, or just want to talk about hex grids —","footerRights":"All rights reserved.","footerPrivacy":"Privacy Policy","publisherLine":"Streben and Streben Der Jäger are published in print by","back":"← Back to Forty Sided Studio","privacyTitle":"Privacy Policy","updated":"Last updated:","intro":"This Privacy Policy explains how Forty Sided Studio (\"we\", \"us\", \"our\") handles information in connection with our games and apps, including","introApp":"Streben Der Jäger","introEnd":"(the \"App\").","h1":"Who we are","p1":"Forty Sided Studio is an independent, single-developer games studio. You can reach us at","h2":"Information we collect","p2a":"The App is designed to work primarily offline and does not require an account to play. We do not collect personal information such as your name, email address, or contact list.","p2b":"If the App uses any third-party services in the future (for example, crash reporting, analytics, or advertising), those services may collect limited technical data (such as device model, operating system version, or app crash logs) as necessary to operate. This document will be updated to reflect any such service before it is enabled, and the Data Safety section of the App's Google Play listing will always reflect the current, accurate state.","h3":"Data sharing","p3":"We do not sell your data. Where any third-party service is used (see above), data is only shared with that service to the extent needed for it to function, subject to that service's own privacy policy.","h4":"Children's privacy","p4":"The App is not directed at children under 13 and we do not knowingly collect personal information from children.","h5":"Your choices","p5":"Since the App does not require registration and stores gameplay data locally on your device by default, you can remove all local App data at any time by uninstalling the App.","h6":"Changes to this policy","p6":"We may update this Privacy Policy as the App evolves. Changes will be posted on this page with an updated revision date above.","h7":"Contact","p7":"Questions about this policy or your data can be sent to"},"it":{"langName":"IT","eyebrow":"Indipendente · Dark Fantasy · Old School","tagline":"Il d40 non esiste. Lo abbiamo tirato comunque.","navStudio":"Studio","navWorld":"Il Mondo","navProject":"Progetto Attuale","navContact":"Contatti","founderTitle":"Chi Sono","founderName":"Davide — alias Halba100","founderP1":"Davide risponde a due nomi: il suo, e Halba100 — l'alias sotto cui tira dadi, maledice schermi CRT e colleziona antiche schede elettroniche da quando riesce a ricordare. La leggenda (la sua) vuole che si sia costruito un cabinet arcade anni '80 solo per avere un posto dove evocare i suoi fantasmi. Quando gli schermi lo lasciano andare, si rifugia in montagna — chiamatelo trekking, chiamatela penitenza.","founderCredit":"Ha anche scritto per il materiale originale: l'espansione di Streben","founderCreditWork":"Oltre l'Impero: Hamburg","aboutTitle":"Lo Studio","aboutP1":"Forty Sided Studio è una fucina di una sola persona, ma non di un principiante. Il suo fondatore gioca al tavolo da decenni e per anni ha gestito qualcosa di più grande: campagne live, con personaggi originali, trame e mondi interi costruiti da zero per eventi LARP. Tutto qui parte dallo stesso posto — un amore autentico per il gioco come media, qualunque forma prenda.","aboutP2":"Nessun publisher, nessun comitato. Solo uno sviluppatore che lavora anche da 25 anni nel settore IT, e porta nella creazione dei giochi la stessa disciplina e organizzazione — una pila di quaderni, una passione di lunga data per le griglie esagonali e i cieli cupi, e abbastanza rigore di processo da portare davvero le cose a termine. Sviluppato fianco a fianco con Giovanni Galli, creatore del gioco di ruolo Streben e del suo spin-off in solitario Streben Der Jäger, che valida ogni passo dell'adattamento.","galliName":"Giovanni Galli","galliCaption":"Creatore di Streben — vincitore, NDU Awards 2022, Miglior Ambientazione (People's Choice)","galliNote":"Il manuale base di Streben è disponibile anche in inglese, e l'ambientazione è cresciuta negli anni attraverso numerosi moduli e avventure.","galliLinkText":"Scopri Streben","worldTitle":"Streben","worldSubtitle":"Il buio oltre l'apocalisse","worldTagline":"Streben è un Gioco di Ruolo Old School Grim Fantasy Post-Apocalittico dove gli uomini combattono per sopravvivere, affidandosi a tutto quello che gli è rimasto. Resistere è l'unica salvezza.","worldP1":"Anno Domini 1220: l'Apocalisse è arrivata. Un globo di fuoco ha attraversato i cieli d'Europa ed è sprofondato sotto il Mar Mediterraneo. Un boato ha scosso il mondo — poi è iniziato l'incubo. I primi superstiti parlarono di devastazione e di morti a perdita d'occhio; le spedizioni mandate a indagare non fecero più ritorno, e presto l'incubo divenne la normalità. Ovunque comparvero mostri: abomini di ogni forma, pronti a uccidere chiunque capitasse a tiro.","worldP2":"L'Umanità provò a organizzarsi — e lo fecero anche loro. I Regni degli Uomini caddero uno dopo l'altro. Poi arrivarono i mischling, ibridi a metà tra bestia e uomo: la forza dell'una, l'astuzia dell'altro, e un'organizzazione sociale che li rendeva più pericolosi di molti mostri solitari. Dopo decenni di caos e rovina, una speranza sorse dalle ceneri del Sacro Romano Impero: il nuovo Impero degli Eroi, nato dall'unione di nove città fortificate strette in un unico baluardo contro la fine.","worldP3":"Nell'Impero degli Eroi, chiunque dimostri di esserne degno può diventare campione della propria città; e se l'Imperatore viene a mancare, il nuovo sovrano è scelto tra i nove campioni, messi alla prova finché non resta il più virtuoso. A tenere insieme tutto questo è un dettame di ferro imposto dal Magistero, la nuova fede che incatena a sé ogni Marchiato — chi è nato capace di piegare la magia — e mette fuorilegge ogni traccia del passato: tutte le religioni conosciute sono bandite, e nulla di ciò che venne prima può sopravvivere.","worldP4":"Eppure c'è chi continua ad arricchirsi saccheggiando in segreto le vecchie rocche distrutte, rivendendo i tesori ai collezionisti tramite il mercato nero: li chiamano Schatzjäger. Milizia, Magistero, la gilda dei mercenari presente in ogni città, o la feccia pronta a rischiare tutto per arricchirsi e minare le fondamenta del nuovo ordine imperiale — la scelta è tua. Qualunque strada prenderai, a Streben potrai farti largo con il sacrificio e la determinazione... o morire nel tentativo.","projectTitle":"Progetto Attuale","projectName":"Streben Der Jäger","projectSub":"Un adattamento tattico a esagoni del gioco in solitario Streben Der Jäger, ambientato nel mondo oscuro di Streben.","projectDesc":"Streben Der Jäger è nato come gioco da tavolo in solitario, con missioni procedurali su griglia ambientate nel mondo oscuro di Streben. Questa versione digitale ne mantiene il nucleo tattico e ad alta rigiocabilità: muoviti fase dopo fase su un terreno esagonale spezzato, scegli quando colpire e quando tenere la linea, e trascina ciò che resta di una città fortificata attraverso sei missioni di acciaio e abomini — fino alla redenzione finale, se sopravvivi abbastanza a lungo.","statusLine":"In sviluppo — mobile, Android","roadmap":[{"label":"Motore di combattimento tattico a esagoni","status":"Quasi completo","done":true,"detail":"Movimento, linea di vista, iniziativa, mostri con IA e pathfinding proprio, sistema di talenti e incantesimi, pozioni, punti fortuna: il nucleo di regole è implementato e giocabile end-to-end."},{"label":"Narrativa della campagna e world-building","status":"In corso","done":true,"detail":"Sei missioni giocabili, cutscene per i momenti chiave, un percorso di redenzione dopo 12 missioni superate, Cimitero e Galleria dei Campioni per i personaggi che non ce l'hanno fatta (o che ce l'hanno fatta). L'espansione della lore continua."},{"label":"Interfaccia e controlli mobile","status":"Quasi completo","done":true,"detail":"Build Android nativa e funzionante, controlli pensati da zero per il touch (niente dialog di sistema), tutorial interattivo per i nuovi giocatori, sistema di obiettivi/achievement, localizzazione in 5 lingue."},{"label":"Playtesting chiuso","status":"In preparazione","done":false,"detail":"Prossimo passo: un primo gruppo ristretto di tester su build Android per raccogliere feedback prima di un rilascio più ampio."},{"label":"Localizzazione multilingua (IT/EN/FR/ES/DE)","status":"Completato","done":true,"detail":"Sito e interfaccia di gioco tradotti, con rilevamento automatico della lingua."}],"contactTitle":"Contattaci","contactText":"Domande, stampa, feedback, o vuoi solo parlare di griglie esagonali —","footerRights":"Tutti i diritti riservati.","footerPrivacy":"Informativa sulla Privacy","publisherLine":"Streben e Streben Der Jäger sono pubblicati su carta da","back":"← Torna a Forty Sided Studio","privacyTitle":"Informativa sulla Privacy","updated":"Ultimo aggiornamento:","intro":"La presente Informativa sulla Privacy spiega come Forty Sided Studio (\"noi\") gestisce le informazioni in relazione ai nostri giochi e app, incluso","introApp":"Streben Der Jäger","introEnd":"(l'\"App\").","h1":"Chi siamo","p1":"Forty Sided Studio è uno studio di sviluppo indipendente, gestito da una sola persona. Puoi contattarci a","h2":"Informazioni che raccogliamo","p2a":"L'App è progettata per funzionare principalmente offline e non richiede un account per giocare. Non raccogliamo informazioni personali come nome, indirizzo email o rubrica.","p2b":"Se in futuro l'App utilizzerà servizi di terze parti (ad esempio crash reporting, analytics o pubblicità), tali servizi potrebbero raccogliere dati tecnici limitati (come modello del dispositivo, versione del sistema operativo o log di crash) necessari al loro funzionamento. Questo documento sarà aggiornato per riflettere tali servizi prima della loro attivazione, e la sezione Data Safety della scheda Google Play dell'App rifletterà sempre lo stato attuale e accurato.","h3":"Condivisione dei dati","p3":"Non vendiamo i tuoi dati. Quando viene utilizzato un servizio di terze parti (vedi sopra), i dati vengono condivisi solo nella misura necessaria al suo funzionamento, soggetta alla privacy policy di quel servizio.","h4":"Privacy dei minori","p4":"L'App non è rivolta a minori di 13 anni e non raccogliamo consapevolmente informazioni personali da minori.","h5":"Le tue scelte","p5":"Poiché l'App non richiede registrazione e memorizza i dati di gioco localmente sul tuo dispositivo per impostazione predefinita, puoi rimuovere tutti i dati locali in qualsiasi momento disinstallando l'App.","h6":"Modifiche a questa informativa","p6":"Potremmo aggiornare questa Informativa sulla Privacy con l'evolversi dell'App. Le modifiche saranno pubblicate su questa pagina con una data di revisione aggiornata.","h7":"Contatti","p7":"Domande su questa informativa o sui tuoi dati possono essere inviate a"},"fr":{"langName":"FR","eyebrow":"Indépendant · Dark Fantasy · Racines Jeu de Rôle sur Table","tagline":"Le d40 n'existe pas. On l'a lancé quand même.","navStudio":"Studio","navWorld":"Le Monde","navProject":"Projet Actuel","navContact":"Contact","founderTitle":"À Propos de Moi","founderName":"Davide — alias Halba100","founderP1":"Davide répond à deux noms : le sien, et Halba100 — l'alias sous lequel il lance des dés, maudit des écrans CRT et amasse de vieilles cartes électroniques depuis qu'il s'en souvient. La légende (la sienne) veut qu'il ait construit une borne d'arcade des années 80 rien que pour avoir un endroit où invoquer ses fantômes. Quand les écrans le libèrent enfin, il se réfugie en montagne — appelez ça de la randonnée, appelez ça une pénitence.","founderCredit":"Il a aussi écrit pour le matériel d'origine : l'extension de Streben","founderCreditWork":"Oltre l'Impero: Hamburg","aboutTitle":"Le Studio","aboutP1":"Forty Sided Studio est une forge d'une seule personne, mais pas d'un débutant. Son fondateur joue autour d'une table depuis des décennies et a, pendant des années, dirigé quelque chose de plus grand : des campagnes grandeur nature, avec personnages originaux, intrigues et mondes entiers construits de toutes pièces pour des événements de LARP. Tout ici part du même endroit — un amour sincère du jeu comme média, quelle que soit sa forme.","aboutP2":"Pas d'éditeur, pas de comité. Juste un développeur qui travaille aussi depuis 25 ans dans l'IT, et qui apporte à la création de jeux la même rigueur et la même organisation — une pile de carnets, un goût persistant pour les grilles hexagonales et les ciels lugubres, et assez de discipline de processus pour réellement livrer. Développé main dans la main avec Giovanni Galli, créateur du jeu de rôle Streben et de son spin-off solo Streben Der Jäger, qui valide chaque étape de l'adaptation.","galliName":"Giovanni Galli","galliCaption":"Créateur de Streben — lauréat, NDU Awards 2022, Best Setting (People's Choice)","galliNote":"Le manuel de base de Streben est aussi disponible en anglais, et l'univers s'est enrichi au fil des ans grâce à de nombreux modules et aventures.","galliLinkText":"Découvrir Streben","worldTitle":"Streben","worldSubtitle":"Les Ténèbres au-delà de l'Apocalypse","worldTagline":"Streben est un jeu de rôle Old School Grim Fantasy post-apocalyptique où l'humanité se bat pour survivre, en s'appuyant sur tout ce qu'il lui reste. Résister est le seul salut.","worldP1":"Anno Domini 1220 : l'Apocalypse est arrivée. Un globe de feu a traversé les cieux d'Europe et a sombré sous la mer Méditerranée. Un grondement a secoué le monde — puis le cauchemar a commencé. Les premiers survivants ont parlé de dévastation et de morts à perte de vue ; les expéditions envoyées enquêter ne sont jamais revenues, et bientôt le cauchemar est simplement devenu la norme. Des monstres apparurent partout : des abominations de toutes formes, prêtes à tuer tout ce qui passait à leur portée.","worldP2":"L'Humanité tenta de s'organiser — eux aussi. Les Royaumes des Hommes tombèrent l'un après l'autre. Puis vinrent les mischling, hybrides à mi-chemin entre bête et homme : la force de l'une, la ruse de l'autre, organisés en sociétés qui les rendaient plus dangereux que bien des monstres solitaires. Après des décennies de chaos et de ruine, un espoir renaquit des cendres du Saint Empire romain germanique : le nouvel Empire des Héros, né de l'union de neuf cités fortifiées en un unique rempart contre la fin.","worldP3":"Dans l'Empire des Héros, quiconque se montre digne peut devenir le champion de sa cité ; et si l'Empereur venait à disparaître, le nouveau souverain serait choisi parmi les neuf champions, mis à l'épreuve jusqu'à ce que ne reste que le plus vertueux. Ce qui maintient tout cela ensemble, c'est un décret de fer édicté par le Magistère, la nouvelle foi qui lie à elle chaque Marqué — ceux nés capables de plier la magie — et met hors-la-loi toute trace du passé : toutes les religions connues sont interdites, et rien de ce qui existait avant ne peut survivre.","worldP4":"Et pourtant, certains continuent de s'enrichir en pillant en secret d'anciennes forteresses en ruine, revendant leurs trésors à des collectionneurs via le marché noir : on les appelle les Schatzjäger. Milice, Magistère, la guilde des mercenaires présente dans chaque cité, ou la racaille prête à tout risquer pour s'enrichir et ébranler les fondations du nouvel ordre impérial — le choix vous appartient. Quelle que soit la voie choisie, dans Streben vous pourrez vous frayer un chemin par le sacrifice et la détermination... ou mourir en essayant.","projectTitle":"Projet Actuel","projectName":"Streben Der Jäger","projectSub":"Une adaptation tactique hexagonale du jeu solo Streben Der Jäger, dans l'univers sombre de Streben.","projectDesc":"Streben Der Jäger est né comme jeu de plateau solo, avec des missions procédurales sur grille situées dans l'univers sombre de Streben. Cette version numérique en conserve le cœur tactique et hautement rejouable : avancez phase par phase sur un sol hexagonal brisé, choisissez quand frapper et quand tenir la ligne, et traînez ce qu'il reste d'une cité fortifiée à travers six missions d'acier et d'abominations — jusqu'à la rédemption finale, si vous survivez assez longtemps.","statusLine":"En développement — mobile, Android","roadmap":[{"label":"Moteur de combat tactique hexagonal","status":"Presque terminé","done":true,"detail":"Déplacement, ligne de vue, initiative, monstres avec IA et pathfinding propres, système de talents et de sorts, potions, points de chance : le socle de règles est implémenté et jouable de bout en bout."},{"label":"Narration de campagne et world-building","status":"En cours","done":true,"detail":"Six missions jouables, des cinématiques pour les moments clés, un arc de rédemption après 12 missions réussies, un Cimetière et une Galerie des Champions. La lore et le contenu narratif continuent de s'étoffer."},{"label":"Interface et contrôles mobiles","status":"Presque terminé","done":true,"detail":"Build Android native et fonctionnelle, contrôles tactiles conçus depuis zéro (aucune boîte de dialogue système), tutoriel interactif, système de succès, localisation en 5 langues."},{"label":"Playtest fermé","status":"En préparation","done":false,"detail":"Prochaine étape : un premier petit groupe de testeurs sur la build Android pour recueillir des retours avant une sortie plus large."},{"label":"Localisation multilingue (IT/EN/FR/ES/DE)","status":"Terminé","done":true,"detail":"Site et interface de jeu traduits, avec détection automatique de la langue."}],"contactTitle":"Nous Contacter","contactText":"Questions, presse, retours, ou juste envie de parler de grilles hexagonales —","footerRights":"Tous droits réservés.","footerPrivacy":"Politique de Confidentialité","publisherLine":"Streben et Streben Der Jäger sont publiés en version papier par","back":"← Retour à Forty Sided Studio","privacyTitle":"Politique de Confidentialité","updated":"Dernière mise à jour :","intro":"Cette Politique de Confidentialité explique comment Forty Sided Studio (\"nous\") traite les informations en lien avec nos jeux et applications, y compris","introApp":"Streben Der Jäger","introEnd":"(l'« Application »).","h1":"Qui nous sommes","p1":"Forty Sided Studio est un studio de jeux indépendant, développé par une seule personne. Vous pouvez nous contacter à","h2":"Informations que nous collectons","p2a":"L'Application est conçue pour fonctionner principalement hors ligne et ne nécessite pas de compte pour jouer. Nous ne collectons pas d'informations personnelles telles que votre nom, adresse e-mail ou liste de contacts.","p2b":"Si l'Application utilise à l'avenir des services tiers (par exemple, rapport de plantage, analytique ou publicité), ces services peuvent collecter des données techniques limitées (comme le modèle de l'appareil, la version du système d'exploitation ou les journaux de plantage) nécessaires à leur fonctionnement. Ce document sera mis à jour pour refléter tout service de ce type avant son activation, et la section Sécurité des données de la fiche Google Play de l'Application reflétera toujours l'état actuel et exact.","h3":"Partage des données","p3":"Nous ne vendons pas vos données. Lorsqu'un service tiers est utilisé (voir ci-dessus), les données ne sont partagées que dans la mesure nécessaire à son fonctionnement, sous réserve de la politique de confidentialité de ce service.","h4":"Confidentialité des enfants","p4":"L'Application ne s'adresse pas aux enfants de moins de 13 ans et nous ne collectons pas sciemment d'informations personnelles auprès d'enfants.","h5":"Vos choix","p5":"Comme l'Application ne nécessite pas d'inscription et stocke les données de jeu localement sur votre appareil par défaut, vous pouvez supprimer toutes les données locales de l'Application à tout moment en la désinstallant.","h6":"Modifications de cette politique","p6":"Nous pouvons mettre à jour cette Politique de Confidentialité à mesure que l'Application évolue. Les modifications seront publiées sur cette page avec une date de révision mise à jour ci-dessus.","h7":"Contact","p7":"Les questions concernant cette politique ou vos données peuvent être envoyées à"},"es":{"langName":"ES","eyebrow":"Independiente · Dark Fantasy · Raíces de Rol de Mesa","tagline":"El d40 no existe. Lo tiramos igualmente.","navStudio":"Estudio","navWorld":"El Mundo","navProject":"Proyecto Actual","navContact":"Contacto","founderTitle":"Sobre Mí","founderName":"Davide — alias Halba100","founderP1":"Davide responde a dos nombres: el suyo, y Halba100 — el alias bajo el cual tira dados, maldice pantallas CRT y acumula placas electrónicas antiguas desde que tiene memoria. La leyenda (la suya) dice que se construyó un mueble arcade estilo años 80 solo para tener un lugar donde invocar a sus fantasmas. Cuando las pantallas por fin lo sueltan, se refugia en la montaña — llámalo senderismo, llámalo penitencia.","founderCredit":"También ha escrito para el material original: la expansión de Streben","founderCreditWork":"Oltre l'Impero: Hamburg","aboutTitle":"El Estudio","aboutP1":"Forty Sided Studio es una fragua de una sola persona, pero no de un principiante. Su fundador juega a la mesa desde hace décadas y, durante años, dirigió algo más grande: campañas en vivo, con personajes originales, tramas y mundos enteros construidos desde cero para eventos de LARP. Todo aquí parte del mismo lugar — un amor genuino por el juego como medio, sea cual sea su forma.","aboutP2":"Sin editorial, sin comité. Solo un desarrollador que también lleva 25 años trabajando en IT, y que aporta a la creación de juegos ese mismo rigor y organización — una pila de cuadernos, un apetito duradero por las cuadrículas hexagonales y los cielos sombríos, y suficiente disciplina de proceso como para sacar las cosas adelante de verdad. Desarrollado codo con codo con Giovanni Galli, creador del juego de rol Streben y de su spin-off en solitario Streben Der Jäger, que valida cada paso de la adaptación.","galliName":"Giovanni Galli","galliCaption":"Creador de Streben — ganador, NDU Awards 2022, Best Setting (People's Choice)","galliNote":"El manual base de Streben también está disponible en inglés, y el mundo ha crecido a lo largo de los años a través de numerosos módulos y aventuras.","galliLinkText":"Descubre Streben","worldTitle":"Streben","worldSubtitle":"La oscuridad más allá del apocalipsis","worldTagline":"Streben es un juego de rol Old School Grim Fantasy postapocalíptico donde la humanidad lucha por sobrevivir, apoyándose en todo lo que le queda. Resistir es la única salvación.","worldP1":"Anno Domini 1220: llegó el Apocalipsis. Un globo de fuego cruzó los cielos de Europa y se hundió bajo el mar Mediterráneo. Un estruendo sacudió el mundo — y entonces empezó la pesadilla. Los primeros supervivientes hablaron de devastación y muertos hasta donde alcanzaba la vista; las expediciones enviadas a investigar nunca regresaron, y pronto la pesadilla se convirtió simplemente en la nueva normalidad. Aparecieron monstruos por todas partes: abominaciones de toda forma, dispuestas a matar cuanto se cruzara en su camino.","worldP2":"La Humanidad intentó organizarse — y ellos también. Los Reinos de los Hombres cayeron uno tras otro. Luego llegaron los mischling, híbridos a medio camino entre bestia y hombre: la fuerza de uno, la astucia del otro, organizados en sociedades que los hacían más peligrosos que muchos monstruos solitarios. Tras décadas de caos y ruina, surgió una esperanza de las cenizas del Sacro Imperio Romano Germánico: el nuevo Imperio de los Héroes, nacido de la unión de nueve ciudades fortificadas en un único baluarte contra el fin.","worldP3":"En el Imperio de los Héroes, cualquiera que demuestre ser digno puede convertirse en campeón de su ciudad; y si el Emperador llegara a faltar, el nuevo soberano se elegiría entre los nueve campeones, puestos a prueba hasta que solo quede el más virtuoso. Todo se mantiene unido por un decreto de hierro dictado por el Magisterio, la nueva fe que encadena a cada Marcado — quienes nacen capaces de doblegar la magia — y declara fuera de la ley todo rastro del pasado: todas las religiones conocidas están prohibidas, y nada de lo que existió antes puede sobrevivir.","worldP4":"Y sin embargo, hay quien sigue enriqueciéndose saqueando en secreto viejas fortalezas en ruinas, revendiendo los tesoros a coleccionistas a través del mercado negro: los llaman Schatzjäger. Milicia, Magisterio, el gremio de mercenarios presente en cada ciudad, o la escoria dispuesta a arriesgarlo todo para enriquecerse y socavar los cimientos del nuevo orden imperial — la elección es tuya. Sea cual sea el camino que tomes, en Streben podrás abrirte paso con sacrificio y determinación... o morir en el intento.","projectTitle":"Proyecto Actual","projectName":"Streben Der Jäger","projectSub":"Una adaptación táctica hexagonal del juego en solitario Streben Der Jäger, ambientada en el oscuro mundo de Streben.","projectDesc":"Streben Der Jäger nació como juego de mesa en solitario, con misiones procedurales sobre cuadrícula ambientadas en el oscuro mundo de Streben. Esta versión digital conserva ese núcleo táctico y de alta rejugabilidad: avanza fase a fase por un terreno hexagonal roto, elige cuándo atacar y cuándo mantener la línea, y arrastra lo que queda de una ciudad fortificada a través de seis misiones de acero y abominios — hasta la redención final, si sobrevives lo suficiente.","statusLine":"En desarrollo — móvil, Android","roadmap":[{"label":"Motor de combate táctico hexagonal","status":"Casi completo","done":true,"detail":"Movimiento, línea de visión, iniciativa, monstruos con IA y pathfinding propios, sistema de talentos y hechizos, pociones, puntos de suerte: el núcleo de reglas está implementado y jugable de principio a fin."},{"label":"Narrativa de campaña y world-building","status":"En curso","done":true,"detail":"Seis misiones jugables, cutscenes para los momentos clave, un arco de redención tras superar 12 misiones, un Cementerio y una Galería de Campeones. La lore y el contenido narrativo siguen creciendo."},{"label":"Interfaz y controles móviles","status":"Casi completo","done":true,"detail":"Build de Android nativa y funcional, controles táctiles diseñados desde cero (sin diálogos de sistema), tutorial interactivo, sistema de logros, localización en 5 idiomas."},{"label":"Playtesting cerrado","status":"En preparación","done":false,"detail":"Siguiente paso: un primer grupo reducido de testers en la build de Android para recoger feedback antes de un lanzamiento más amplio."},{"label":"Localización multilingüe (IT/EN/FR/ES/DE)","status":"Completado","done":true,"detail":"Sitio e interfaz del juego traducidos, con detección automática del idioma."}],"contactTitle":"Contáctanos","contactText":"Preguntas, prensa, comentarios, o solo quieres hablar de cuadrículas hexagonales —","footerRights":"Todos los derechos reservados.","footerPrivacy":"Política de Privacidad","publisherLine":"Streben y Streben Der Jäger se publican en papel por","back":"← Volver a Forty Sided Studio","privacyTitle":"Política de Privacidad","updated":"Última actualización:","intro":"Esta Política de Privacidad explica cómo Forty Sided Studio (\"nosotros\") maneja la información en relación con nuestros juegos y aplicaciones, incluyendo","introApp":"Streben Der Jäger","introEnd":"(la \"App\").","h1":"Quiénes somos","p1":"Forty Sided Studio es un estudio de videojuegos independiente de un solo desarrollador. Puedes contactarnos en","h2":"Información que recopilamos","p2a":"La App está diseñada para funcionar principalmente sin conexión y no requiere una cuenta para jugar. No recopilamos información personal como tu nombre, correo electrónico o lista de contactos.","p2b":"Si en el futuro la App utiliza servicios de terceros (por ejemplo, informes de errores, análisis o publicidad), esos servicios pueden recopilar datos técnicos limitados (como el modelo del dispositivo, la versión del sistema operativo o los registros de fallos) necesarios para funcionar. Este documento se actualizará para reflejar dicho servicio antes de que se active, y la sección de Seguridad de los Datos de la ficha de Google Play de la App siempre reflejará el estado actual y preciso.","h3":"Compartición de datos","p3":"No vendemos tus datos. Cuando se utiliza algún servicio de terceros (ver arriba), los datos solo se comparten en la medida necesaria para que funcione, sujeto a la propia política de privacidad de ese servicio.","h4":"Privacidad de los menores","p4":"La App no está dirigida a menores de 13 años y no recopilamos conscientemente información personal de menores.","h5":"Tus opciones","p5":"Dado que la App no requiere registro y almacena los datos de juego localmente en tu dispositivo de forma predeterminada, puedes eliminar todos los datos locales de la App en cualquier momento desinstalándola.","h6":"Cambios a esta política","p6":"Podemos actualizar esta Política de Privacidad a medida que la App evoluciona. Los cambios se publicarán en esta página con una fecha de revisión actualizada arriba.","h7":"Contacto","p7":"Las preguntas sobre esta política o tus datos pueden enviarse a"},"de":{"langName":"DE","eyebrow":"Unabhängig · Dark Fantasy · Pen-&-Paper-Wurzeln","tagline":"Den d40 gibt es nicht. Wir haben trotzdem gewürfelt.","navStudio":"Studio","navWorld":"Die Welt","navProject":"Aktuelles Projekt","navContact":"Kontakt","founderTitle":"Über Mich","founderName":"Davide — alias Halba100","founderP1":"Davide hört auf zwei Namen: seinen eigenen und Halba100 — das Alias, unter dem er Würfel wirft, CRT-Bildschirme verflucht und uralte Platinen hortet, seit er sich erinnern kann. Die Legende (seine eigene) besagt, er habe sich einen Arcade-Automaten im 80er-Stil gebaut, nur um einen Ort zu haben, an dem er seine Geister beschwören kann. Wenn die Bildschirme ihn endlich freigeben, flüchtet er sich in die Berge — nennt es Wandern, nennt es Buße.","founderCredit":"Er hat auch für das Quellmaterial selbst geschrieben: die Streben-Erweiterung","founderCreditWork":"Oltre l'Impero: Hamburg","aboutTitle":"Das Studio","aboutP1":"Forty Sided Studio ist eine Ein-Mann-Schmiede, aber nicht die eines Anfängers. Ihr Gründer sitzt seit Jahrzehnten am Tisch und hat jahrelang etwas Größeres geleitet: Live-Kampagnen mit eigenen Charakteren, Handlungssträngen und ganzen Welten, die eigens für LARP-Events von Grund auf gebaut wurden. Alles hier beginnt am selben Punkt — einer echten Liebe zum Spiel als Medium, ganz gleich in welcher Form.","aboutP2":"Kein Verlag, kein Komitee. Nur ein Entwickler, der zudem seit 25 Jahren in der IT arbeitet und dieselbe Disziplin und Organisation in die Spieleentwicklung einbringt — ein Stapel Notizbücher, eine anhaltende Vorliebe für Hexfelder und finstere Himmel, und genug Prozessdisziplin, um Dinge tatsächlich fertigzustellen. Entwickelt Hand in Hand mit Giovanni Galli, dem Schöpfer des Pen-&-Paper-Rollenspiels Streben und seines Solo-Ablegers Streben Der Jäger, der jeden Schritt der Adaption validiert.","galliName":"Giovanni Galli","galliCaption":"Schöpfer von Streben — Gewinner, NDU Awards 2022, Best Setting (People's Choice)","galliNote":"Das Streben-Grundregelwerk ist auch auf Englisch erhältlich, und die Welt ist im Laufe der Jahre durch zahlreiche Module und Abenteuer gewachsen.","galliLinkText":"Streben entdecken","worldTitle":"Streben","worldSubtitle":"Die Finsternis jenseits der Apokalypse","worldTagline":"Streben ist ein Old-School-Grim-Fantasy-Postapokalypse-Rollenspiel, in dem die Menschheit ums Überleben kämpft und sich auf das stützt, was ihr geblieben ist. Widerstand ist die einzige Rettung.","worldP1":"Anno Domini 1220: die Apokalypse kam. Eine feurige Kugel zog über die Himmel Europas und versank unter dem Mittelmeer. Ein Donnern erschütterte die Welt — dann begann der Albtraum. Die ersten Überlebenden berichteten von Verwüstung und Toten, so weit das Auge reichte; die zur Erkundung entsandten Expeditionen kehrten nie zurück, und bald wurde der Albtraum schlicht zum Alltag. Überall tauchten Monster auf: Abominationen jeder Gestalt, bereit, alles zu töten, was in ihre Reichweite geriet.","worldP2":"Die Menschheit versuchte, sich zu organisieren — ebenso taten es sie. Die Königreiche der Menschen fielen eines nach dem anderen. Dann kamen die Mischlinge, Hybride auf halbem Weg zwischen Tier und Mensch: die Kraft des einen, die List des anderen, organisiert in Gesellschaften, die sie gefährlicher machten als so manches einzelgängerische Monster. Nach Jahrzehnten des Chaos und Verfalls erhob sich Hoffnung aus der Asche des Heiligen Römischen Reiches: das neue Reich der Helden, geboren aus neun befestigten Städten, die sich zu einem einzigen Bollwerk gegen das Ende zusammenschlossen.","worldP3":"Im Reich der Helden kann jeder, der sich als würdig erweist, zum Champion seiner Stadt werden; und sollte der Kaiser sterben, wird der nächste Herrscher unter den neun Champions gewählt, geprüft, bis nur der Tugendhafteste übrig bleibt. Zusammengehalten wird all das durch ein eisernes Dekret des Magisteriums, des neuen Glaubens, der jeden Gezeichneten an sich bindet — jene, die geboren wurden, um Magie zu wirken — und jede Spur der Vergangenheit ächtet: Alle bekannten Religionen sind verboten, nichts von dem, was vorher war, darf überdauern.","worldP4":"Und doch werden manche weiterhin reich, indem sie heimlich alte, zerstörte Festungen plündern und ihre Schätze über den Schwarzmarkt an Sammler verkaufen: Man nennt sie Schatzjäger. Miliz, Magisterium, die in jeder Stadt vertretene Söldnergilde — oder der Abschaum, der bereit ist, alles zu riskieren, um sich zu bereichern und die Grundfesten der neuen imperialen Ordnung zu untergraben: Die Wahl liegt bei dir. Welchen Weg du auch wählst, in Streben kannst du dir deinen Weg mit Opferbereitschaft und Entschlossenheit bahnen... oder beim Versuch sterben.","projectTitle":"Aktuelles Projekt","projectName":"Streben Der Jäger","projectSub":"Eine taktische Hex-Adaption des Solospiels Streben Der Jäger, angesiedelt in der düsteren Welt von Streben.","projectDesc":"Streben Der Jäger begann als Solo-Brettspiel mit prozedural generierten Missionen auf einem Raster, angesiedelt in der düsteren Welt von Streben. Diese digitale Version bewahrt diesen taktischen, hoch wiederspielbaren Kern: Bewege dich Phase für Phase über zerbrochenes Hexgelände, entscheide, wann du zuschlägst und wann du die Linie hältst, und schleppe, was von einer befestigten Stadt übrig ist, durch sechs Missionen aus Stahl und Abominationen — bis zur endgültigen Erlösung, wenn du lange genug überlebst.","statusLine":"In Entwicklung — mobil, Android","roadmap":[{"label":"Taktische Hex-Kampf-Engine","status":"Fast fertig","done":true,"detail":"Bewegung, Sichtlinie, Initiative, Monster mit eigener KI und Pathfinding, ein Talent- und Zaubersystem, Tränke, Glückspunkte: das Kern-Regelwerk ist implementiert und von Anfang bis Ende spielbar."},{"label":"Kampagnen-Narrativ & World-Building","status":"In Arbeit","done":true,"detail":"Sechs spielbare Missionen, Zwischensequenzen für Schlüsselmomente, ein Erlösungsbogen nach 12 abgeschlossenen Missionen, ein Friedhof und eine Ruhmeshalle der Champions. Lore und neue erzählerische Inhalte wachsen stetig weiter."},{"label":"Mobile UI & Steuerung","status":"Fast fertig","done":true,"detail":"Funktionierender nativer Android-Build, von Grund auf für Touch entwickelte Steuerung (keine Systemdialoge), interaktives Tutorial, Achievement-System, Lokalisierung in 5 Sprachen."},{"label":"Geschlossener Playtest","status":"In Vorbereitung","done":false,"detail":"Nächster Schritt: eine erste kleine Testergruppe auf dem Android-Build, um Feedback vor einer breiteren Veröffentlichung zu sammeln."},{"label":"Mehrsprachige Lokalisierung (IT/EN/FR/ES/DE)","status":"Abgeschlossen","done":true,"detail":"Website und Spieloberfläche übersetzt, mit automatischer Spracherkennung."}],"contactTitle":"Kontakt Aufnehmen","contactText":"Fragen, Presse, Feedback, oder einfach Lust, über Hexfelder zu reden —","footerRights":"Alle Rechte vorbehalten.","footerPrivacy":"Datenschutzerklärung","publisherLine":"Streben und Streben Der Jäger werden gedruckt herausgegeben von","back":"← Zurück zu Forty Sided Studio","privacyTitle":"Datenschutzerklärung","updated":"Zuletzt aktualisiert:","intro":"Diese Datenschutzerklärung erklärt, wie Forty Sided Studio (\"wir\") Informationen im Zusammenhang mit unseren Spielen und Apps verarbeitet, einschließlich","introApp":"Streben Der Jäger","introEnd":"(die „App\").","h1":"Wer wir sind","p1":"Forty Sided Studio ist ein unabhängiges Ein-Personen-Spielestudio. Du erreichst uns unter","h2":"Informationen, die wir sammeln","p2a":"Die App ist so konzipiert, dass sie hauptsächlich offline funktioniert und kein Konto zum Spielen erfordert. Wir sammeln keine personenbezogenen Daten wie deinen Namen, deine E-Mail-Adresse oder dein Adressbuch.","p2b":"Sollte die App künftig Dienste Dritter nutzen (z. B. Absturzberichte, Analyse oder Werbung), können diese Dienste begrenzte technische Daten (wie Gerätemodell, Betriebssystemversion oder Absturzprotokolle) sammeln, die für ihren Betrieb erforderlich sind. Dieses Dokument wird vor Aktivierung eines solchen Dienstes aktualisiert, und der Abschnitt zur Datensicherheit im Google-Play-Eintrag der App gibt stets den aktuellen, korrekten Stand wieder.","h3":"Datenweitergabe","p3":"Wir verkaufen deine Daten nicht. Wird ein Dienst Dritter genutzt (siehe oben), werden Daten nur in dem für dessen Funktion nötigen Umfang weitergegeben, vorbehaltlich der eigenen Datenschutzerklärung dieses Dienstes.","h4":"Datenschutz für Kinder","p4":"Die App richtet sich nicht an Kinder unter 13 Jahren, und wir sammeln wissentlich keine personenbezogenen Daten von Kindern.","h5":"Deine Wahlmöglichkeiten","p5":"Da die App keine Registrierung erfordert und Spieldaten standardmäßig lokal auf deinem Gerät speichert, kannst du alle lokalen App-Daten jederzeit durch Deinstallation der App entfernen.","h6":"Änderungen dieser Richtlinie","p6":"Wir können diese Datenschutzerklärung im Zuge der Weiterentwicklung der App aktualisieren. Änderungen werden auf dieser Seite mit einem aktualisierten Revisionsdatum oben veröffentlicht.","h7":"Kontakt","p7":"Fragen zu dieser Richtlinie oder deinen Daten können gesendet werden an"}};
const ORDER = ["it","en","fr","es","de"];
document.getElementById('year').textContent = new Date().getFullYear();

function detectLang() {
  const saved = localStorage.getItem('fss-lang');
  if (saved && T[saved]) return saved;
  const code = (navigator.language || 'it').slice(0,2).toLowerCase();
  return T[code] ? code : 'it';
}

function render(lang) {
  const t = T[lang] || T.it;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.getAttribute('data-t');
    if (t[key] !== undefined) el.textContent = t[key];
  });
  const rm = document.getElementById('roadmap');
  rm.innerHTML = '';
  t.roadmap.forEach(item => {
    const row = document.createElement('div');
    row.className = 'roadmap-item';
    row.innerHTML = '<div class="roadmap-head"><span class="roadmap-dot ' + (item.done ? 'done' : 'pending') + '"></span>' +
      '<span class="roadmap-label" style="color:' + (item.done ? 'var(--ink)' : 'var(--ink-dim)') + '">' + item.label + '</span>' +
      '<span class="roadmap-status" style="color:' + (item.done ? 'var(--gold-dim)' : 'var(--ink-dim)') + '">' + item.status + '</span></div>' +
      '<p class="roadmap-detail">' + item.detail + '</p>';
    rm.appendChild(row);
  });
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

function setLang(lang) {
  localStorage.setItem('fss-lang', lang);
  render(lang);
}

const langRow = document.getElementById('lang-row');
ORDER.forEach(code => {
  const btn = document.createElement('button');
  btn.className = 'lang-btn';
  btn.dataset.lang = code;
  btn.textContent = T[code].langName;
  btn.addEventListener('click', () => setLang(code));
  langRow.appendChild(btn);
});

render(detectLang());
</script>
